<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>tinderbox receiver</title>
    <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      #caps { position: fixed; top: 16px; left: 16px; padding: 12px 16px; background: rgba(0,0,0,.75);
              color: #fff; font: 28px/1.4 monospace; white-space: pre; z-index: 9; }
      iframe { border: 0; width: 100vw; height: 100vh; display: block; }
    </style>
  </head>
  <body>
    <iframe src="./index.html" allow="autoplay; fullscreen"></iframe>
    <div id="caps"></div>
    <script>
      // Capability report, shown for 2 minutes so it can be read off the TV.
      const gl = (t) => { try { return !!document.createElement("canvas").getContext(t); } catch (e) { return false; } };
      const yn = (b) => (b ? "YES" : "no");
      document.getElementById("caps").textContent =
        "WebGPU:  " + yn(!!navigator.gpu) + "\nWebGL2:  " + yn(gl("webgl2")) +
        "\nWebGL1:  " + yn(gl("webgl")) + "\nwasm:    " + yn(typeof WebAssembly === "object") +
        "\n" + navigator.userAgent.replace(/.*(CrKey\/[\d.]+|Chrome\/[\d.]+).*/, "$1");
      setTimeout(() => document.getElementById("caps").remove(), 120000);
    </script>
    <script>
      // No media to play: just keep the receiver alive and show the sim.
      const ctx = cast.framework.CastReceiverContext.getInstance();
      const opts = new cast.framework.CastReceiverOptions();
      opts.disableIdleTimeout = true;
      ctx.start(opts);
    </script>
  </body>
</html>
