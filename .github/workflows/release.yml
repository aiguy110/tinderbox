# Builds native binaries on a version tag (v*) and publishes them as a GitHub
# release. Run it by hand (workflow_dispatch) to build without releasing.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 for an older glibc, so the binary runs on more distros.
          - os: ubuntu-22.04
            name: linux-x86_64
          - os: macos-14
            name: macos-aarch64
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml and installs the pinned toolchain.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          dir=tinderbox-${{ matrix.name }}
          mkdir "$dir"
          cp target/release/tinderbox README.md "$dir/"
          if [ "$RUNNER_OS" = Linux ]; then cp tools/saver/tinderbox-saver tools/saver/tinderbox-lock "$dir/"; fi
          tar czf "$dir.tar.gz" "$dir"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "tinderbox-${{ matrix.name }}"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/release/tinderbox.exe, README.md $dir
          Compress-Archive $dir "$dir.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: tinderbox-${{ matrix.name }}
          path: tinderbox-${{ matrix.name }}.*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes tinderbox-*
