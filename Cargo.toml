[package]
name = "tinderbox"
version = "0.6.0"
edition = "2024"
publish = false

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
egui = "0.36"
egui-wgpu = "0.36"
miniz_oxide = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-time = "1"
wgpu = { version = "30", features = ["webgl"] }
winit = "0.30"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
png = "0.18"
pollster = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6"
x11-dl = "2.21"
zbus = "5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlCanvasElement", "Storage", "Window", "console"] }

[profile.release]
opt-level = 3
lto = "thin"

# The scene shader runs per pixel on the GPU, but the sim bookkeeping and
# egui are slow enough unoptimized to matter.
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2
